<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕狐技术支持</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#e8742b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#a1a1a6; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, "PingFang SC", sans-serif; margin:0; padding:24px 16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:28px; } h2 { font-size:19px; margin-top:28px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>字幕狐 · 技术支持</h1>
<p class="muted">外语视频 · 零延迟中文字幕</p>

<h2>常见问题</h2>
<p><strong>没有出现字幕？</strong><br>请确认字幕按钮显示"字幕已开"，并在 App 设置中下载对应的语音模型和翻译语言包（日语或英语）。部分网站的视频格式暂不支持。</p>
<p><strong>字幕语言不对？</strong><br>在字幕面板中切换"视频语言"（日语 / 英语），App 会重新识别当前视频。</p>
<p><strong>如何恢复购买？</strong><br>打开 设置 → 字幕狐专业版 → 恢复购买，使用购买时的 Apple ID 即可。</p>
<p><strong>免费额度什么时候重置？</strong><br>每天 0 点重置，免费版每天可使用 15 分钟视频字幕。</p>

<h2>联系我们</h2>
<p>有问题或建议，请 <a href="https://github.com/xiaozhizhi123/zimuhu/issues">在这里提交反馈</a>。</p>

<p><a href="privacy.html">隐私政策</a></p>
</main>
</body>
</html>
